name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          sed -i 's/VERSION_21/VERSION_17/g' android/app/capacitor.build.gradle

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          cd android
          echo "Using JAVA_HOME: $JAVA_HOME"
          java -version
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew app:assembleDebug -x lint -x test --no-daemon --info > build.log 2>&1 || (tail -n 100 build.log && false)

      - name: Upload Android Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CypherBuddy-Android-APK
          path: android/app/build/outputs/apk/debug/
          retention-days: 30
