name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          find . -name "build.gradle" -exec sed -i 's/8.13.0/8.7.3/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/compileSdk = 36/compileSdk = 35/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/abortOnError = true/abortOnError = false/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/warningsAsErrors = true/warningsAsErrors = false/g' {} + || true
          find . -name "build.gradle" -exec sed -i "s/androidxBrowserVersion : '1.9.0'/androidxBrowserVersion : '1.8.0'/g" {} + || true
          sed -i '/cordova.variables.gradle/d' android/app/capacitor.build.gradle || true

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - building a debug APK (not suitable for App Links verification)."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test -x checkReleaseAarMetadata -x checkDebugAarMetadata --no-daemon --stacktrace > gradle_build.log 2>&1 || {
            echo "::error::Gradle build failed. Showing last 100 lines of build log:"
            tail -n 100 gradle_build.log
            exit 1
          }

      - name: Show signing fingerprint for assetlinks.json
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "### assetlinks.json SHA-256 fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK (fallback)
        if: steps.keystore.outputs.available != 'true'
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test -x checkDebugAarMetadata -x checkReleaseAarMetadata --no-daemon --stacktrace

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CypherBuddy-Android-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

