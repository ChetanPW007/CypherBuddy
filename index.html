<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield-buddy.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1329" />
    <meta name="description" content="CypherBuddy - Your Smart Digital Safety Companion. Simple security scanner, scam checker, and visual digital assistant for everyone." />
    <title>CypherBuddy - Your Smart Digital Safety Companion</title>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body style="background:#0b1329;margin:0">
    <div id="root"></div>
    <!-- If the app bundle fails before React starts, show the error instead of a blank white screen. -->
    <script>
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.innerHTML = '<div style="padding:24px;color:#f8fafc;font-family:system-ui,sans-serif"><h3>CypherBuddy could not start</h3><pre style="white-space:pre-wrap;color:#fda4af;font-size:12px">' +
            String(e.message || e.error || 'Unknown error').replace(/</g, '&lt;') + '</pre></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
