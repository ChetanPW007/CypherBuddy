<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M50 8 L85 24 V48 C85 70 69 88 50 94 C31 88 15 70 15 48 V24 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)"/>
        
  <!-- Inner Translucent Shield -->
  <path d="M50 14 L79 28 V48 C79 66 65 82 50 87 C35 82 21 66 21 48 V28 Z" 
        fill="#0f172a" 
        fill-opacity="0.65" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1.5"/>

  <!-- Friendly Buddy Face / Eye Core -->
  <circle cx="38" cy="44" r="5" fill="#34d399" />
  <circle cx="39.5" cy="42.5" r="1.8" fill="#ffffff" />

  <circle cx="62" cy="44" r="5" fill="#34d399" />
  <circle cx="63.5" cy="42.5" r="1.8" fill="#ffffff" />

  <!-- Smiling Security Arch -->
  <path d="M40 56 Q50 64 60 56" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="3.5" 
        stroke-linecap="round"/>

  <!-- Sparkle Accent -->
  <path d="M50 25 L52 29 L56 31 L52 33 L50 37 L48 33 L44 31 L48 29 Z" fill="#ffffff"/>
</svg>
