# Render Blueprint for CypherBuddy FastAPI Backend
services:
  - type: web
    name: cypherbuddy-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # Secrets: set these in the Render dashboard (sync: false = never stored in the repo)
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      # Production safety: the master OTP 123456 must stay disabled
      - key: ALLOW_DEV_OTP
        value: "false"
