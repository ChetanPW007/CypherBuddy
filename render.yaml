# Render Blueprint for CypherBuddy FastAPI Backend
services:
  - type: web
    name: cypherbuddy-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
